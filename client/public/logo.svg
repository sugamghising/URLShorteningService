<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f0f4f8" stroke="#0066cc" stroke-width="2"/>

  <!-- Link chain symbol (first link) -->
  <path d="M 50 100 Q 50 75 75 75 Q 90 75 90 90 L 90 110 Q 90 125 75 125 Q 50 125 50 100" fill="none" stroke="#0066cc" stroke-width="4" stroke-linecap="round"/>

  <!-- Link chain symbol (second link) -->
  <path d="M 110 100 Q 110 75 135 75 Q 150 75 150 90 L 150 110 Q 150 125 135 125 Q 110 125 110 100" fill="none" stroke="#0066cc" stroke-width="4" stroke-linecap="round"/>

  <!-- Connecting line in middle -->
  <line x1="90" y1="100" x2="110" y2="100" stroke="#0066cc" stroke-width="4" stroke-linecap="round"/>

  <!-- Arrow pointing right (compression effect) -->
  <path d="M 155 90 L 170 100 L 155 110" fill="none" stroke="#00cc66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="155" y1="100" x2="170" y2="100" stroke="#00cc66" stroke-width="3" stroke-linecap="round"/>
</svg>